<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Off-hours: Nordic noir. The good kind, where the detective ends up worse off than the victim.">

<style>
  .snow { stroke:#E4EEF6; stroke-linecap:round; fill:none; }
  .cap  { fill:#DCE8F0; }
  .pane { fill:#16202A; }
  .pine { fill:#0C1520; }
  .ice  { stroke:#4A6478; fill:none; stroke-linecap:round; }
  .eyebrow { font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-size:12px;
             font-weight:600; letter-spacing:7px; fill:#9DB0C0; text-anchor:middle; }
  .title   { font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-size:46px;
             font-weight:200; letter-spacing:16px; fill:#F2F8FC; text-anchor:middle;
             stroke:#0A121B; stroke-width:5; paint-order:stroke; }
  .subline { font-family:Georgia,"Times New Roman",serif; font-size:15px; font-style:italic;
             fill:#B2C3D0; text-anchor:middle; stroke:#0A121B; stroke-width:3.5; paint-order:stroke; }
  .rule { stroke:#5C7488; stroke-width:1; opacity:.5; }

  .a { transform-box: fill-box; }

  .f1 { animation: fallA 8s linear infinite; }
  .f2 { animation: fallA 11s linear infinite; }
  .f3 { animation: fallA 15s linear infinite; }
  @keyframes fallA { from { transform: translateY(0); } to { transform: translateY(60px); } }
  .sw1 { animation: sway 5.4s ease-in-out infinite; }
  .sw2 { animation: sway 7.3s ease-in-out infinite -2s; }
  .sw3 { animation: sway 9.6s ease-in-out infinite -4s; }
  @keyframes sway { 0%,100% { transform: translateX(-10px); } 50% { transform: translateX(10px); } }

  .sp1 { animation: drop 21s linear infinite; }
  .sp2 { animation: drop 27s linear infinite -9s; }
  .sp3 { animation: drop 33s linear infinite -18s; }
  .sp4 { animation: drop 25s linear infinite -5s; }
  @keyframes drop { from { transform: translateY(-50px); } to { transform: translateY(380px); } }
  .spin1 { transform-origin:50% 50%; animation: spin 12s ease-in-out infinite; }
  .spin2 { transform-origin:50% 50%; animation: spin 16s ease-in-out infinite -6s; }
  @keyframes spin { 0%,100% { transform: rotate(0) scale(.75); opacity:.45; }
                    50% { transform: rotate(180deg) scale(1.15); opacity:1; } }

  .w1 { animation: win 9s ease-in-out infinite; }
  .w2 { animation: win 13s ease-in-out infinite -4s; }
  .w3 { animation: win 17s ease-in-out infinite -9s; }
  .w4 { animation: win 23s ease-in-out infinite -14s; }
  @keyframes win { 0%,100% { opacity:1; } 47% { opacity:.55; } 53% { opacity:.95; } }

  .lamp { animation: lamp 6.4s ease-in-out infinite; }
  @keyframes lamp { 0%,100% { opacity:.95; } 40% { opacity:.74; } 44% { opacity:1; } 49% { opacity:.82; } }

  .haze { animation: haze 13s ease-in-out infinite; }
  @keyframes haze { 0%,100% { opacity:.09; } 50% { opacity:.15; } }

  .halo1 { transform-origin:50% 50%; animation: halo 9s ease-in-out infinite; }
  .halo2 { transform-origin:50% 50%; animation: halo 13s ease-in-out infinite -4s; }
  @keyframes halo { 0%,100% { transform:scale(1); opacity:.16; } 50% { transform:scale(1.1); opacity:.09; } }

  .au1 { animation: au 21s ease-in-out infinite; }
  .au2 { animation: au 29s ease-in-out infinite -9s; }
  .au3 { animation: au 37s ease-in-out infinite -17s; }
  @keyframes au { 0%,100% { transform:translateX(0) scaleY(1); opacity:.16; }
                  50% { transform:translateX(48px) scaleY(1.28); opacity:.34; } }

  .r1 { transform-origin:50% 0%; animation: refl 5.6s ease-in-out infinite; }
  .r2 { transform-origin:50% 0%; animation: refl 7.4s ease-in-out infinite -2.5s; }
  .r3 { transform-origin:50% 0%; animation: refl 9.2s ease-in-out infinite -4.9s; }
  @keyframes refl { 0%,100% { transform:scaleY(1) scaleX(1); opacity:.26; }
                    50% { transform:scaleY(1.3) scaleX(.8); opacity:.13; } }

  .tw1 { transform-origin:50% 50%; animation: tw 4.2s ease-in-out infinite; }
  .tw2 { transform-origin:50% 50%; animation: tw 5.8s ease-in-out infinite -1.5s; }
  .tw3 { transform-origin:50% 50%; animation: tw 7.1s ease-in-out infinite -3s; }
  @keyframes tw { 0%,100% { opacity:.25; transform:scale(.85); } 50% { opacity:.95; transform:scale(1.15); } }

  .fog1 { animation: fg1 34s ease-in-out infinite; }
  .fog2 { animation: fg2 43s ease-in-out infinite; }
  @keyframes fg1 { 0%,100% { transform:translateX(0); } 50% { transform:translateX(36px); } }
  @keyframes fg2 { 0%,100% { transform:translateX(0); } 50% { transform:translateX(-30px); } }

  @media (prefers-reduced-motion: reduce) { .a { animation: none !important; } }
</style>

