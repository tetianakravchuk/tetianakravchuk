<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Black cats among books and candles under moon phases">

<style>
  .fur    { fill: #16171B; }
  .inner  { fill: #C87F86; }
  .eye    { fill: #F0902E; }
  .pupil  { fill: #16171B; }
  .nose   { fill: #E09AA2; }
  .whisk  { stroke: #9AA7AD; stroke-width: 1.1; stroke-linecap: round; fill: none; opacity: .7; }
  .moon   { fill: #F0DCA4; }
  .star   { fill: #F7EBC4; }
  .cloud  { fill: #74858C; }
  .page   { fill: #F2EAD8; }
  .tail   { fill: none; stroke: #16171B; stroke-width: 9; stroke-linecap: round; }

  .a { transform-box: fill-box; }

  .swA { transform-origin: 4% 60%; animation: sw 4.4s ease-in-out infinite; }
  .swB { transform-origin: 96% 60%; animation: sw 5.8s ease-in-out infinite reverse; }
  .swC { transform-origin: 90% 80%; animation: sw 6.6s ease-in-out infinite; }
  @keyframes sw { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(7deg); } }

  .breathe { transform-origin: 50% 100%; animation: br 5.2s ease-in-out infinite; }
  @keyframes br { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.012,1.045); } }

  .blA { animation: bl 6.5s ease-in-out infinite; }
  .blB { animation: bl 8.4s ease-in-out infinite 2.2s; }
  .blA,.blB { transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes bl { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }

  .ear1 { transform-origin: 50% 100%; animation: ef 7.4s ease-in-out infinite; }
  .ear2 { transform-origin: 50% 100%; animation: ef 9.1s ease-in-out infinite 3s; }
  @keyframes ef { 0%,90%,100% { transform: rotate(0); } 94% { transform: rotate(-12deg); } 97% { transform: rotate(3deg); } }

  .tw1 { animation: tw 3.6s ease-in-out infinite; }
  .tw2 { animation: tw 4.8s ease-in-out infinite 1.2s; }
  .tw3 { animation: tw 5.7s ease-in-out infinite 2.4s; }
  .tw1,.tw2,.tw3 { transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes tw { 0%,100% { opacity: .4; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }

  .fl1 { animation: fl 1.5s ease-in-out infinite; }
  .fl2 { animation: fl 1.9s ease-in-out infinite .3s; }
  .fl3 { animation: fl 1.3s ease-in-out infinite .7s; }
  .fl1,.fl2,.fl3 { transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes fl { 0%,100% { transform: scale(1,1) skewX(0deg); } 50% { transform: scale(.88,1.14) skewX(4deg); } }

  .st1 { animation: st 4s ease-out infinite; }
  .st2 { animation: st 4s ease-out infinite 1.3s; }
  .st3 { animation: st 4s ease-out infinite 2.6s; }
  .st1,.st2,.st3 { transform-box: fill-box; }
  @keyframes st { 0% { transform: translateY(0) scale(.6); opacity: 0; } 30% { opacity: .7; } 100% { transform: translateY(-26px) scale(1.1); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) { .a { animation: none !important; } }
</style>

