<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="A frozen northern island, a bridge, and an old house with one window lit">

<style>
  .dark  { fill: #080D14; }
  .pine  { fill: #0C1520; }
  .snowc { fill: #C9D9E5; }
  .warm  { fill: #E8C87A; }
  .ice   { stroke: #4A6478; fill: none; stroke-linecap: round; }
  .snow  { stroke: #DCE8F0; stroke-linecap: round; fill: none; }

  .a { transform-box: fill-box; }

  .f1 { animation: fallA 7.5s linear infinite; }
  .f2 { animation: fallA 10.5s linear infinite; }
  .f3 { animation: fallA 14s linear infinite; }
  @keyframes fallA { from { transform: translateY(0); } to { transform: translateY(60px); } }

  .sw1 { animation: sway 5.2s ease-in-out infinite; }
  .sw2 { animation: sway 7.1s ease-in-out infinite -2s; }
  .sw3 { animation: sway 9.4s ease-in-out infinite -4s; }
  @keyframes sway { 0%,100% { transform: translateX(-9px); } 50% { transform: translateX(9px); } }

  .au1 { animation: au 19s ease-in-out infinite; }
  .au2 { animation: au 26s ease-in-out infinite -8s; }
  .au3 { animation: au 33s ease-in-out infinite -15s; }
  @keyframes au {
    0%,100% { transform: translateX(0) scaleY(1); opacity: .16; }
    50%     { transform: translateX(46px) scaleY(1.22); opacity: .30; }
  }

  .lit { animation: lit 11s ease-in-out infinite; }
  @keyframes lit { 0%,100% { opacity: .95; } 44% { opacity: .62; } 49% { opacity: .98; } 55% { opacity: .74; } }
  .lit2 { animation: lit2 15s ease-in-out infinite -5s; }
  @keyframes lit2 { 0%,100% { opacity: .55; } 50% { opacity: .35; } }

  .tw1 { transform-origin: 50% 50%; animation: tw 4.1s ease-in-out infinite; }
  .tw2 { transform-origin: 50% 50%; animation: tw 5.7s ease-in-out infinite -1.4s; }
  .tw3 { transform-origin: 50% 50%; animation: tw 6.9s ease-in-out infinite -3s; }
  @keyframes tw { 0%,100% { opacity: .35; } 50% { opacity: .9; } }

  .fog1 { animation: d1 31s ease-in-out infinite; }
  .fog2 { animation: d2 41s ease-in-out infinite; }
  @keyframes d1 { 0%,100% { transform: translateX(0); } 50% { transform: translateX(38px); } }
  @keyframes d2 { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-30px); } }

  @media (prefers-reduced-motion: reduce) { .a { animation: none !important; } }
</style>

<rect width="900" height="220" rx="14" fill="#0D1620"/>
<rect y="86" width="900" height="70" fill="#0C141D"/>
<rect y="156" width="900" height="64" fill="#111C26"/>

<!-- aurora -->
<g fill="#4FBF9F">
  <g class="a au1"><path d="M60 62 C 220 26, 420 74, 640 40 C 760 22, 840 44, 900 34 L900 60 C 830 70, 750 50, 640 66 C 430 98, 220 54, 60 86 Z" opacity=".2"/></g>
  <g class="a au2"><path d="M0 44 C 180 14, 380 56, 560 30 C 700 10, 820 36, 900 22 L900 40 C 810 56, 700 32, 560 50 C 380 74, 180 36, 0 64 Z" opacity=".14"/></g>
</g>
<g fill="#5E8FC4">
  <g class="a au3"><path d="M120 78 C 300 50, 480 90, 700 62 L700 78 C 480 106, 300 68, 120 94 Z" opacity=".12"/></g>
</g>

<!-- stars -->
<g fill="#E4EEF6">
  <circle class="a tw1" cx="88" cy="26" r="1.6"/><circle class="a tw2" cx="196" cy="18" r="1.3"/>
  <circle class="a tw3" cx="322" cy="30" r="1.5"/><circle class="a tw1" cx="452" cy="16" r="1.2"/>
  <circle class="a tw2" cx="588" cy="26" r="1.6"/><circle class="a tw3" cx="700" cy="14" r="1.3"/>
  <circle class="a tw1" cx="806" cy="28" r="1.5"/><circle class="a tw2" cx="866" cy="16" r="1.2"/>
  <circle class="a tw3" cx="252" cy="52" r="1.2"/><circle class="a tw1" cx="512" cy="48" r="1.3"/>
  <circle class="a tw2" cx="742" cy="52" r="1.2"/><circle class="a tw3" cx="140" cy="48" r="1.4"/>
</g>

<!-- island treeline -->
<g class="pine">
  <path d="M360 158 L378 106 L396 158 Z"/><path d="M406 158 L428 96 L450 158 Z"/>
  <path d="M456 158 L470 118 L484 158 Z"/><path d="M700 158 L722 100 L744 158 Z"/>
  <path d="M748 158 L764 116 L780 158 Z"/><path d="M788 158 L812 94 L836 158 Z"/>
  <path d="M842 158 L858 120 L874 158 Z"/>
</g>
<g class="snowc" opacity=".5">
  <path d="M371 128 L378 106 L385 128 L378 124 Z"/>
  <path d="M418 120 L428 96 L438 120 L428 115 Z"/>
  <path d="M712 124 L722 100 L732 124 L722 119 Z"/>
  <path d="M802 118 L812 94 L822 118 L812 113 Z"/>
</g>

<!-- the old house, one window lit -->
<g class="dark">
  <path d="M520 158 L520 118 L556 92 L592 118 L592 158 Z"/>
  <path d="M592 158 L592 130 L616 130 L616 158 Z"/>
  <rect x="546" y="72" width="9" height="22"/>
</g>
<path class="snowc" d="M516 120 L556 90 L596 120 L556 102 Z" opacity=".45"/>
<g class="warm">
  <rect class="a lit" x="548" y="126" width="9" height="11" rx="1"/>
  <rect class="a lit2" x="566" y="127" width="8" height="10" rx="1"/>
  <rect class="a lit2" x="598" y="138" width="7" height="9" rx="1"/>
</g>
<ellipse class="a lit" cx="552" cy="132" rx="26" ry="16" fill="#E8C87A" opacity=".07"/>

<!-- bridge to the mainland -->
<g>
  <rect x="0" y="150" width="330" height="5" fill="#0A1119"/>
  <rect x="0" y="148" width="330" height="2.5" fill="#8FA6B8" opacity=".28"/>
  <g fill="#0A1119">
    <rect x="46" y="155" width="6" height="22"/><rect x="118" y="155" width="6" height="24"/>
    <rect x="190" y="155" width="6" height="23"/><rect x="262" y="155" width="6" height="22"/>
  </g>
  <g stroke="#6E8496" stroke-width="1.1" opacity=".3" fill="none">
    <path d="M0 142 L330 142"/>
    <path d="M20 142 L20 150 M60 142 L60 150 M100 142 L100 150 M140 142 L140 150
             M180 142 L180 150 M220 142 L220 150 M260 142 L260 150 M300 142 L300 150"/>
  </g>
</g>

<!-- frozen water -->
<g class="ice" opacity=".2" stroke-width="1.1">
  <path d="M40 186 L120 178 L196 190 L280 180"/>
  <path d="M120 178 L136 196 L92 208"/>
  <path d="M340 176 L426 186 L510 174 L604 184"/>
  <path d="M426 186 L440 204 L498 210"/>
  <path d="M640 178 L724 188 L818 176 L890 186"/>
  <path d="M724 188 L740 206 L690 212"/>
  <path d="M200 200 L286 210 L370 198"/>
</g>
<g fill="#DCE8F0" opacity=".08">
  <ellipse cx="200" cy="196" rx="120" ry="7"/>
  <ellipse cx="600" cy="200" rx="150" ry="6"/>
</g>

<ellipse class="a lit" cx="552" cy="168" rx="5" ry="12" fill="#E8C87A" opacity=".14"/>

<!-- fog -->
<g fill="#4E6272" opacity=".11">
  <g class="a fog1"><ellipse cx="260" cy="160" rx="220" ry="11"/></g>
  <g class="a fog2"><ellipse cx="680" cy="166" rx="240" ry="9"/></g>
</g>

<!-- snow -->
<g class="snow" opacity=".45" stroke-width="1.6">
  <g class="a sw3"><g class="a f3">
    <path d="M50 -60 L50 240" stroke-dasharray="0.1 60"/>
    <path d="M148 -48 L148 240" stroke-dasharray="0.1 60"/>
    <path d="M266 -66 L266 240" stroke-dasharray="0.1 60"/>
    <path d="M382 -40 L382 240" stroke-dasharray="0.1 60"/>
    <path d="M498 -58 L498 240" stroke-dasharray="0.1 60"/>
    <path d="M624 -44 L624 240" stroke-dasharray="0.1 60"/>
    <path d="M742 -62 L742 240" stroke-dasharray="0.1 60"/>
    <path d="M858 -50 L858 240" stroke-dasharray="0.1 60"/>
  </g></g>
</g>
<g class="snow" opacity=".6" stroke-width="2.1">
  <g class="a sw2"><g class="a f2">
    <path d="M96 -52 L96 240" stroke-dasharray="0.1 60"/>
    <path d="M218 -68 L218 240" stroke-dasharray="0.1 60"/>
    <path d="M334 -44 L334 240" stroke-dasharray="0.1 60"/>
    <path d="M452 -60 L452 240" stroke-dasharray="0.1 60"/>
    <path d="M578 -48 L578 240" stroke-dasharray="0.1 60"/>
    <path d="M696 -64 L696 240" stroke-dasharray="0.1 60"/>
    <path d="M814 -46 L814 240" stroke-dasharray="0.1 60"/>
  </g></g>
</g>
<g class="snow" opacity=".85" stroke-width="2.8">
  <g class="a sw1"><g class="a f1">
    <path d="M126 -56 L126 240" stroke-dasharray="0.1 60"/>
    <path d="M300 -42 L300 240" stroke-dasharray="0.1 60"/>
    <path d="M470 -64 L470 240" stroke-dasharray="0.1 60"/>
    <path d="M660 -50 L660 240" stroke-dasharray="0.1 60"/>
    <path d="M838 -58 L838 240" stroke-dasharray="0.1 60"/>
  </g></g>
</g>

</svg>
